<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>EduSlide AI</title>
<meta name="color-scheme" content="light dark">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { darkMode: 'media' }
</script>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<style>
  body{font-family:Inter,sans-serif}
  .serif{font-family:Fraunces,serif}
  *{transition: background-color 0.2s, color 0.2s, border-color 0.2s}
</style>
</head>
<body class="bg-white dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased">

<header class="border-b border-slate-100 dark:border-slate-800 sticky top-0 bg-white/90 dark:bg-slate-950/90 backdrop-blur z-40">
  <div class="max-w-5xl mx-auto px-4 md:px-6 h-14 flex items-center justify-between">
    <div class="flex items-center gap-2.5">
      <div class="w-7 h-7 rounded-xl bg-slate-900 dark:bg-white text-white dark:text-slate-900 grid place-items-center text-xs font-bold">E</div>
      <div class="flex flex-col leading-none">
        <span class="serif text-[17px] font-semibold tracking-tight">EduSlide AI</span>
        <span class="text-[8px] font-semibold tracking-[0.15em] uppercase text-slate-500 dark:text-slate-400 mt-0.5">Warung Kode Pak W</span>
      </div>
    </div>
    <div class="w-2 h-2 rounded-full bg-emerald-500"></div>
  </div>
</header>

<main class="max-w-5xl mx-auto px-4 md:px-6 py-6 md:py-10 space-y-6">

  <section class="bg-slate-50 dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-5 md:p-7">
    <h2 class="text-[13px] font-semibold tracking-wide uppercase text-slate-600 dark:text-slate-400 mb-4">Parameter Bahan Ajar</h2>
    <form id="generateForm" class="space-y-4">
      <textarea id="topicInput" rows="3" required class="w-full rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 px-4 py-3 text-[15px] leading-6 placeholder:text-slate-400 dark:placeholder:text-slate-500 text-slate-900 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-slate-900 dark:focus:ring-white" placeholder="Tulis detail topik yang ingin dibahas beserta ilustrasi gambar"></textarea>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
        <select id="audienceInput" class="w-full rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 px-4 py-3 text-sm text-slate-900 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-slate-900 dark:focus:ring-white">
          <option value="Siswa SMP / SMA - Bahasa Edukatif & Menarik" selected>SMP / SMA</option>
          <option>SD</option>
          <option>Mahasiswa</option>
          <option>Umum</option>
        </select>
        <select id="slideCountInput" class="w-full rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 px-4 py-3 text-sm text-slate-900 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-slate-900 dark:focus:ring-white">
          <option value="3" selected>3 Slide</option>
          <option value="5">5 Slide</option>
          <option value="7">7 Slide</option>
        </select>
      </div>
      <button type="submit" id="btnGenerate" class="w-full bg-slate-900 dark:bg-white hover:bg-black dark:hover:bg-slate-200 text-white dark:text-slate-900 rounded-xl py-3.5 text-sm font-medium">Generate Bahan Ajar</button>
    </form>
  </section>

  <div id="loadingState" class="hidden py-16 flex flex-col items-center gap-3">
    <div class="w-5 h-5 border-2 border-slate-900 dark:border-white border-t-transparent rounded-full animate-spin"></div>
  </div>

  <div id="errorAlert" class="hidden">
    <div class="rounded-2xl border border-red-200 dark:border-red-900/50 bg-red-50 dark:bg-red-950/30 p-5 space-y-3">
      <div class="flex items-start gap-3">
        <div class="w-8 h-8 rounded-full bg-red-100 dark:bg-red-900/50 text-red-600 dark:text-red-300 grid place-items-center text-sm font-bold shrink-0">!</div>
        <div class="space-y-1 flex-1">
          <h3 id="errorTitle" class="text-sm font-semibold text-red-900 dark:text-red-200">Gagal Generate</h3>
          <p id="errorMessage" class="text-sm text-red-700 dark:text-red-300 leading-6">Terjadi kesalahan</p>
          <details id="errorDetailWrap" class="mt-2">
            <summary class="text-xs text-red-600 dark:text-red-400 cursor-pointer select-none">Lihat detail</summary>
            <pre id="errorDetail" class="mt-2 text-[11px] font-mono bg-white dark:bg-slate-900 border border-red-100 dark:border-red-900/30 rounded-xl p-3 whitespace-pre-wrap break-words text-slate-600 dark:text-slate-400"></pre>
          </details>
          <div class="flex gap-2 pt-2">
            <button id="btnRetry" class="text-xs px-4 py-2 rounded-full bg-red-600 text-white font-medium hover:bg-red-700">Coba Lagi</button>
            <button id="btnDismissError" class="text-xs px-4 py-2 rounded-full bg-white dark:bg-slate-800 border border-red-200 dark:border-red-900/50 text-red-700 dark:text-red-300 hover:bg-red-50 dark:hover:bg-slate-700">Tutup</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <section id="presentationViewer" class="hidden space-y-3">
    <div class="flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
      <div class="flex items-center justify-between md:justify-start gap-3 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-full px-2 py-1.5 w-full md:w-auto">
        <div class="flex items-center gap-2">
          <button id="btnPrev" class="w-9 h-9 rounded-full bg-slate-900 dark:bg-white text-white dark:text-slate-900 grid place-items-center text-base disabled:bg-slate-100 dark:disabled:bg-slate-800 disabled:text-slate-300 dark:disabled:text-slate-600">‹</button>
          <span id="navStatus" class="text-xs font-mono text-slate-600 dark:text-slate-400 min-w-[48px] text-center">01 / 03</span>
          <button id="btnNext" class="w-9 h-9 rounded-full bg-slate-900 dark:bg-white text-white dark:text-slate-900 grid place-items-center text-base disabled:bg-slate-100 dark:disabled:bg-slate-800 disabled:text-slate-300 dark:disabled:text-slate-600">›</button>
        </div>
        <button id="btnSavePptx" class="md:hidden text-xs font-medium px-3 py-1.5 rounded-full bg-slate-900 dark:bg-white text-white dark:text-slate-900">PPTX</button>
      </div>
      <button id="btnSavePptxDesktop" class="hidden md:inline-flex text-sm font-medium px-4 py-2 rounded-full border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 hover:bg-slate-50 dark:hover:bg-slate-800 text-slate-900 dark:text-slate-100">Ekspor PPTX</button>
    </div>
    <div id="slidesContainer"></div>
  </section>

</main>

<script type="module">
  import { generatePresentationData } from './lib/core.js';
  import { renderSlides, generateSlideImage, setCurrentIndex, getIsLoading } from './lib/slide.js';
  import { generateImageUrl } from './lib/img.js';

  let currentData = null, currentIndex = 0, imageCache = new Map();
  const form = document.getElementById('generateForm');
  const loadingState = document.getElementById('loadingState');
  const errorAlert = document.getElementById('errorAlert');
  const viewer = document.getElementById('presentationViewer');
  const container = document.getElementById('slidesContainer');

  function showError(err) {
    const ui = err.ui || { title: "Gagal Generate", message: err.message, detail: "", code: "UNKNOWN" };
    document.getElementById('errorTitle').textContent = ui.title + (ui.code ? ` • ${ui.code}` : '');
    document.getElementById('errorMessage').textContent = ui.message;
    const detailEl = document.getElementById('errorDetail');
    const wrap = document.getElementById('errorDetailWrap');
    if (ui.detail) { detailEl.textContent = ui.detail; wrap.classList.remove('hidden'); } else { wrap.classList.add('hidden'); }
    errorAlert.classList.remove('hidden');
    errorAlert.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const topic = document.getElementById('topicInput').value.trim();
    const audience = document.getElementById('audienceInput').value;
    const count = parseInt(document.getElementById('slideCountInput').value);
    errorAlert.classList.add('hidden'); viewer.classList.add('hidden');
    loadingState.classList.remove('hidden');
    document.getElementById('btnGenerate').disabled = true;
    document.getElementById('btnGenerate').textContent = "Menyusun...";
    setTimeout(() => loadingState.scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);
    imageCache.clear();
    try {
      currentData = await generatePresentationData(topic, audience, count);
      renderSlides(currentData, container, imageCache);
      currentIndex = 0; setCurrentIndex(0); updateView();
      loadingState.classList.add('hidden'); viewer.classList.remove('hidden');
      setTimeout(() => viewer.scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);
    } catch (err) {
      loadingState.classList.add('hidden');
      showError(err);
    } finally {
      document.getElementById('btnGenerate').disabled = false;
      document.getElementById('btnGenerate').textContent = "Generate Bahan Ajar";
    }
  });

  document.getElementById('btnRetry').onclick = () => { errorAlert.classList.add('hidden'); form.requestSubmit(); };
  document.getElementById('btnDismissError').onclick = () => errorAlert.classList.add('hidden');

  function updateView() {
    container.querySelectorAll('.slide-item').forEach((el, i) => {
      el.classList.toggle('hidden', i !== currentIndex);
      el.classList.toggle('block', i === currentIndex);
    });
    document.getElementById('navStatus').textContent = `${String(currentIndex+1).padStart(2,'0')} / ${String(container.querySelectorAll('.slide-item').length).padStart(2,'0')}`;
    setCurrentIndex(currentIndex);
  }

  document.getElementById('btnPrev').onclick = () => {
    if (getIsLoading() || currentIndex === 0) return;
    currentIndex--; updateView();
    const s = currentData.slides[currentIndex];
    if (!imageCache.has(s.image_prompt)) generateSlideImage(currentIndex, s, container, imageCache);
  };
  document.getElementById('btnNext').onclick = () => {
    if (getIsLoading()) return;
    const slides = container.querySelectorAll('.slide-item');
    if (currentIndex >= slides.length - 1) return;
    currentIndex++; updateView();
    const s = currentData.slides[currentIndex];
    if (!imageCache.has(s.image_prompt)) generateSlideImage(currentIndex, s, container, imageCache);
  };

  async function blobToDataURL(blob) {
    return new Promise(resolve => {
      const fr = new FileReader();
      fr.onload = () => resolve(fr.result);
      fr.readAsDataURL(blob);
    });
  }

  const exportPptx = async (btn) => {
    if (!currentData) return;
    const orig = btn.textContent; btn.textContent = 'Menyusun…'; btn.disabled = true;
    try {
      const pptx = new PptxGenJS(); pptx.layout = 'LAYOUT_16x9';
      for (let i = 0; i < currentData.slides.length; i++) {
        const sd = currentData.slides[i];
        const sl = pptx.addSlide(); sl.background = { color: 'FFFFFF' };
        sl.addText(sd.title, { x: 0.5, y: 0.4, w: 8.5, h: 0.7, fontSize: 20, bold: true, color: '0F172A' });
        const bullets = (sd.content || []).map(t => ({ text: t, options: { bullet: true, color: '334155' } }));
        if (bullets.length) sl.addText(bullets, { x: 0.5, y: 1.2, w: 5.5, h: 4.5, fontSize: 12 });
        let url = imageCache.get(sd.image_prompt);
        if (!url) { try { url = await generateImageUrl(sd.image_prompt, 768, 512); } catch {} }
        if (url) {
          try {
            let dataUrl = url;
            if (url.startsWith('blob:')) {
              const r = await fetch(url); const b = await r.blob();
              dataUrl = await blobToDataURL(b);
            }
            if (dataUrl.startsWith('data:')) {
              sl.addImage({ data: dataUrl, x: 6.3, y: 1.2, w: 3.2, h: 4.2, sizing: { type: 'cover' } });
            } else {
              sl.addImage({ path: dataUrl, x: 6.3, y: 1.2, w: 3.2, h: 4.2, sizing: { type: 'cover' } });
            }
          } catch {}
        }
      }
      await pptx.writeFile({ fileName: (currentData.title || 'eduslide').replace(/[^a-z0-9]/gi, '_') + '.pptx' });
    } catch (err) {
      alert('Gagal export PPTX: ' + err.message);
    } finally { btn.textContent = orig; btn.disabled = false; }
  };
  document.getElementById('btnSavePptx').onclick = () => exportPptx(document.getElementById('btnSavePptx'));
  document.getElementById('btnSavePptxDesktop').onclick = () => exportPptx(document.getElementById('btnSavePptxDesktop'));
</script>
</body>
</html>
